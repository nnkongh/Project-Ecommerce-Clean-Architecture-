version: '3.8'

services:
    webapi:
        build: 
            context: .
            dockerfile: Dockerfile
            target: webapi
        image: ecommerce-webapi:1.0
        container_name: ecommerce-api
        ports:
            - "8081:8080"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ConnectionStrings__DefaultConnection=Server=db,1433;Database=Ecommerce;User
                                                    Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=true
            - Jwt__Issuer=http://localhost:8081
            - Jwt__Audience=http://localhost:8081
            - Jwt__Key=${JWT_KEY}

            - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
            - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
            - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}

            - EmailConfiguration__SmtpServer=smtp.gmail.com
            - EmailConfiguration__Port=587
            - EmailConfiguration__Username=${SMTP_USERNAME}
            - EmailConfiguration__Password=${SMTP_PASSWORD}
            - EmailConfiguration__FromAddress=${SMTP_FromAddress}
    
            - Authentication__Google__ClientId=${Auth_Google_ClientId}
            - Authentication__Google__ClientSecret=${Auth_Google_ClientSecret}

        depends_on:
            db:
                condition: service_healthy
        networks:
            - ecommerce-networks
    
    web:
        build: 
            context: .
            dockerfile: Dockerfile
            target: web
        image: ecommerce-web:1.0
        container_name: ecommerce-web
        ports:
            - "8080:8080"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ApiSettings__BaseUrl=http://webapi:8080
        depends_on:
            - webapi
        networks:
            - ecommerce-networks
    db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: myapi-db
        restart: always
        ports:
            - "1433:1433"
        environment:
            - ACCEPT_EULA=Y
            - MSSQL_SA_PASSWORD=${DB_SA_PASSWORD}
        volumes:
            - sqldata:/var/opt/mssql
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        networks:
            - ecommerce-networks
networks:
    ecommerce-networks:
        driver: bridge
volumes:
    sqldata: